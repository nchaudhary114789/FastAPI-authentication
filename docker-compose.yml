services:
 mongodb:
   image: mongo:8
   container_name: fastapi_mongodb
   restart: unless-stopped
   ports:
     - "127.0.0.1:27017:27017"
   volumes:
     - mongodb_data:/data/db
   healthcheck:
     test:
       [
         "CMD",
         "mongosh",
         "--quiet",
         "--eval",
         "db.adminCommand('ping').ok"
       ]
     interval: 10s
     timeout: 5s
     retries: 5
 api:
   build:
     context: .
     dockerfile: Dockerfile
   container_name: fastapi_api
   restart: unless-stopped
   ports:
     - "8000:8000"
   env_file:
     - .env
   environment:
     MONGODB_URL: mongodb://mongodb:27017
     MONGODB_DATABASE: ${MONGODB_DATABASE:-fastapi_db}
   volumes:
     - ./private_key.pem:/app/private_key.pem:ro
     - ./public_key.pem:/app/public_key.pem:ro
   depends_on:
     mongodb:
       condition: service_healthy
volumes:
 mongodb_data: